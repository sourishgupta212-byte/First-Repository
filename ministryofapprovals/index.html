<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ministry of Approvals</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>
    <header>
        <h1>Ministry of Approvals</h1>
        <p>Department of Administrative Coordination</p>
    </header>
<main class="mainarea">
    <aside class="sidebar">
        <section id="dashboard">
            <h2>Ministery's Dashboard</h2>
            <p>Get to work..</p>
        </section>
        <section id="applications">
            <h2>Applications</h2>
            <button class="nav-button requests" data-view="pending">
                Pending Applications
            </button>
            <button class="nav-button under-review" data-view ="under-review">
                Under Review
            </button>
            <button class="nav-button ready-for-decision" data-view="ready">
                Ready for Decision
            </button>
        </section>
        <section class="communication">
            <button class="sendapplications" data-view="send">
                Send Requests
            </button>
            <button class="recieveapplications" data-view="mailbox">
                Mailbox
            </button>
        </section>
    </aside>
    <section class="workspace" id="workspace">
        <h2>Get to work.</h2>
        <p>Select a section on the left to manage applications.</p>
    </section>
</main>
