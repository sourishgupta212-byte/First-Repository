<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Open Encyclopedia</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- 1. The Global Header: Sits at the very top of the site -->
    <header>
        <h1>Welcome to Open Encyclopedia</h1>
        <p>Your personal encyclopedia of knowledge.</p>
    </header>
    <!-- 2. The Sidebar Navigation: Sits alongside your content -->
    <aside>
        <h2>Open Encyclopedia</h2>
        <div class="start-links"> 
            <nav>
                <a href="index.html">Main page</a><br>
                <a href="#">Contents</a><br>
                <a href="#">Random article</a><br> 
            </nav>
        </div>
    </aside>
    <!-- 3. The Main Content Area: ONLY holds this specific page's core text -->
    <main>
        <section>
            <h2>Featured articles</h2>
            <p>Your articles will appear here as the encyclopedia grows.</p>
        </section>
    </main>
<link rel="script" href="script.js">
</body>
</html>
